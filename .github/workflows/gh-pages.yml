name: github pages

on:
  push:
    branches:
      - main  # Set a branch to deploy
  pull_request:

permissions:
  contents: write  # Required to push the built site to the gh-pages branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.167.0'
          extended: true

      # FixIt v1 用 css.Sass(transpiler=dartsass) 编译 SCSS，需要原生 Dart Sass
      # 注意：npm 的 `sass`（纯 JS 版）Hugo 不能调用，必须是原生二进制
      - name: Setup Dart Sass
        run: |
          npm i --no-save --prefix "$RUNNER_TEMP/sass" sass-embedded@1.105.1
          find "$RUNNER_TEMP/sass/node_modules" -maxdepth 2 -type d -name dart-sass \
            -exec sh -c 'echo "$1" >> "$GITHUB_PATH"' _ {} \;

      - name: Build
        run: hugo --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
